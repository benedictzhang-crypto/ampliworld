<title id="title">AmpliWorld Golden City: 2 km by 2 km masterplan</title><desc id="desc">Metre-space planning map, north up, showing 64 parcels, river, 34 metre waterfall, ocean, three bridge reservations and precinct height envelopes. This is a design study, not a playable city.</desc>
